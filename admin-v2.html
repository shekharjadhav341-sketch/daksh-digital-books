
<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daksh Digital Books | Master Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0b0d12;--panel:#151922;--gold:#d6ad55;--text:#f5f5f5;--muted:#9ca3af;--line:#292f3b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{background:#11151d;border-bottom:1px solid var(--line);padding:18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{color:var(--gold);font-size:20px;font-weight:bold}
button{background:var(--gold);color:#111;border:0;padding:11px 15px;border-radius:7px;font-weight:bold;cursor:pointer}
button.secondary{background:#303746;color:white}
button.danger{background:#a83232;color:white}
button:disabled{opacity:.5}
main{padding:18px;max-width:1200px;margin:auto}
h2{color:var(--gold)}
input,select,textarea{width:100%;padding:12px;margin:6px 0 14px;background:#0d1118;color:white;border:1px solid var(--line);border-radius:7px}
label{color:#cbd5e1;font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin:15px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:10px}
.stat strong{display:block;color:var(--gold);font-size:27px;margin-top:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
.book{border-bottom:1px solid var(--line);padding:14px 0}
.book h3{margin:0 0 6px;color:var(--gold)}
.small{color:var(--muted);font-size:13px}
.hidden{display:none}
#message{padding:12px;border-radius:7px;margin:10px 0}
#loginBox{max-width:430px;margin:50px auto}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.actions button{font-size:12px;padding:9px}
</style>
</head>
<body>

<header>
  <div class="brand">DAKSH DIGITAL BOOKS</div>
  <div class="row" style="flex:0">
    <button class="secondary" onclick="toggleLanguage()" id="langBtn">मराठी / English</button>
    <button class="secondary hidden" id="logoutBtn" onclick="logout()">Logout</button>
  </div>
</header>

<main>
<div id="message" class="hidden"></div>

<section id="loginBox" class="panel">
  <h2>Master Admin Login</h2>
  <label>Email</label>
  <input id="email" type="email" placeholder="Admin email">
  <label>Password</label>
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()" style="width:100%">Login</button>
</section>

<section id="adminArea" class="hidden">
  <h2 id="welcome">Welcome, Admin</h2>
  <p class="small" id="adminEmail"></p>

  <div class="stats">
    <div class="stat">Total Books<strong id="totalBooks">0</strong></div>
    <div class="stat">Published<strong id="publishedBooks">0</strong></div>
    <div class="stat">Draft Books<strong id="draftBooks">0</strong></div>
  </div>

  <section class="panel">
    <h2 id="formHeading">Add / Edit Book</h2>
    <form id="bookForm">
      <label>मराठी पुस्तकाचे नाव</label>
      <input id="title_mr" placeholder="शेवटचे पत्र">
      <label>हिंदी पुस्तकाचे नाव</label>
      <input id="title_hi" placeholder="आखिरी पत्र">
      <label>English Book Title</label>
      <input id="title_en" placeholder="The Last Letter" required>

      <label>मराठी वर्णन</label>
      <textarea id="description_mr" rows="3"></textarea>

      <div class="row">
        <div>
          <label>Price (₹)</label>
          <input id="price" type="number" min="0" value="99" required>
        </div>
        <div>
          <label>Page Count</label>
          <input id="page_count" type="number" min="1" value="93">
        </div>
      </div>

      <label>Book Language</label>
      <select id="language">
        <option value="mr">Marathi</option>
        <option value="hi">Hindi</option>
        <option value="en">English</option>
        <option value="both">Multiple Languages</option>
      </select>

      <label>PDF File (नवीन PDF निवडा किंवा रिकामे ठेवा)</label>
      <input id="pdfFile" type="file" accept="application/pdf">

      <label>
        <input id="is_free" type="checkbox" style="width:auto">
        Free Book
      </label>
      <br><br>
      <label>
        <input id="is_published" type="checkbox" style="width:auto">
        Publish Book
      </label>
      <br><br>
      <div class="row">
        <button type="submit" id="saveBtn">Save Book</button>
        <button type="button" class="secondary" onclick="resetForm()">Clear Form</button>
      </div>
    </form>
  </section>

  <section class="panel">
    <h2 id="booksHeading">Books Management</h2>
    <input id="searchBook" placeholder="Search books..." oninput="renderBooks()">
    <div id="booksList">Loading books...</div>
  </section>
</section>
</main>

<script>
const SUPABASE_URL = "https://dtdgfcelhgkjaprjhonn.supabase.co";
const SUPABASE_KEY = "sb_publishable_MwiWlkP-42r6nH9dkv3xog_JqAAlFRZ";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let allBooks = [];
let editingId = null;
let language = "both";

function msg(text, error=false){
  const el=document.getElementById("message");
  el.textContent=text;
  el.style.background=error?"#592626":"#24442f";
  el.classList.remove("hidden");
  window.scrollTo(0,0);
}
function toggleLanguage(){
  language=language==="both"?"en":"both";
  document.getElementById("langBtn").textContent=
    language==="both"?"मराठी / English":"English / Marathi";
  document.getElementById("welcome").textContent=
    language==="both"?"नमस्कार Admin | Welcome Admin":"Welcome Admin";
  document.getElementById("formHeading").textContent=
    language==="both"?"पुस्तक जोडा / Edit Book":"Add / Edit Book";
  document.getElementById("booksHeading").textContent=
    language==="both"?"पुस्तक व्यवस्थापन / Books Management":"Books Management";
  document.getElementById("saveBtn").textContent=
    language==="both"?"पुस्तक जतन करा / Save Book":"Save Book";
}
async function login(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  if(!email||!password){msg("Email आणि Password भरा.",true);return}
  const {error}=await db.auth.signInWithPassword({email,password});
  if(error){msg(error.message,true);return}
  await checkAdmin();
}
async function logout(){
  await db.auth.signOut();
  currentUser=null;
  document.getElementById("adminArea").classList.add("hidden");
  document.getElementById("loginBox").classList.remove("hidden");
  document.getElementById("logoutBtn").classList.add("hidden");
  msg("Logged out successfully.");
}
async function checkAdmin(){
  const {data:{user}}=await db.auth.getUser();
  if(!user){
    document.getElementById("loginBox").classList.remove("hidden");
    document.getElementById("adminArea").classList.add("hidden");
    return;
  }
  const {data,error}=await db.from("profiles")
    .select("role").eq("id",user.id).maybeSingle();
  if(error||!data||data.role!=="admin"){
    msg("या अकाउंटला Admin परवानगी नाही.",true);
    await db.auth.signOut();
    return;
  }
  currentUser=user;
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("adminArea").classList.remove("hidden");
  document.getElementById("logoutBtn").classList.remove("hidden");
  document.getElementById("adminEmail").textContent=user.email;
  await loadBooks();
}
async function loadBooks(){
  const {data,error}=await db.from("books").select("*").order("created_at",{ascending:false});
  if(error){msg("Books load error: "+error.message,true);return}
  allBooks=data||[];
  document.getElementById("totalBooks").textContent=allBooks.length;
  document.getElementById("publishedBooks").textContent=allBooks.filter(b=>b.is_published).length;
  document.getElementById("draftBooks").textContent=allBooks.filter(b=>!b.is_published).length;
  renderBooks();
}
function renderBooks(){
  const term=(document.getElementById("searchBook").value||"").toLowerCase();
  const filtered=allBooks.filter(b=>
    [b.title_mr,b.title_hi,b.title_en].some(x=>(x||"").toLowerCase().includes(term))
  );
  const list=document.getElementById("booksList");
  if(!filtered.length){list.textContent="No books found.";return}
  list.innerHTML=filtered.map(b=>`
    <div class="book">
      <h3>${escapeHTML(b.title_mr||b.title_en||"Untitled")}</h3>
      <div>${escapeHTML(b.title_en||"")}</div>
      <div class="small">₹${b.price} | ${b.page_count||"-"} pages |
      ${b.is_published?"Published":"Draft"} |
      ${b.is_free?"Free":"Paid"}</div>
      <div class="actions">
        <button onclick="editBook('${b.id}')">Edit</button>
        <button class="secondary" onclick="togglePublish('${b.id}',${!b.is_published})">
          ${b.is_published?"Unpublish":"Publish"}
        </button>
        <button class="danger" onclick="deleteBook('${b.id}')">Delete</button>
      </div>
    </div>`).join("");
}
function escapeHTML(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function editBook(id){
  const b=allBooks.find(x=>x.id===id);
  if(!b)return;
  editingId=id;
  ["title_mr","title_hi","title_en","description_mr","price","page_count","language"]
    .forEach(k=>document.getElementById(k).value=b[k]??"");
  document.getElementById("is_free").checked=!!b.is_free;
  document.getElementById("is_published").checked=!!b.is_published;
  document.getElementById("formHeading").textContent="Edit Book: "+(b.title_en||"");
  document.getElementById("saveBtn").textContent="Update Book";
  window.scrollTo(0,0);
}
function resetForm(){
  document.getElementById("bookForm").reset();
  editingId=null;
  document.getElementById("formHeading").textContent="Add / Edit Book";
  document.getElementById("saveBtn").textContent="Save Book";
}
async function togglePublish(id,value){
  const {error}=await db.from("books").update({is_published:value}).eq("id",id);
  if(error){msg(error.message,true);return}
  msg(value?"Book published.":"Book moved to draft.");
  await loadBooks();
}
async function deleteBook(id){
  if(!confirm("हे पुस्तक कायमचे Delete करायचे आहे का?"))return;
  const {error}=await db.from("books").delete().eq("id",id);
  if(error){msg(error.message,true);return}
  msg("Book record deleted. Storage PDF may need separate cleanup.");
  await loadBooks();
}
document.getElementById("bookForm").addEventListener("submit",async e=>{
  e.preventDefault();
  if(!currentUser){msg("Please login again.",true);return}
  const btn=document.getElementById("saveBtn");
  btn.disabled=true;
  try{
    let filePath=null;
    const file=document.getElementById("pdfFile").files[0];
    if(file){
      if(file.type!=="application/pdf")throw new Error("फक्त PDF फाइल निवडा.");
      const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
      filePath=currentUser.id+"/"+Date.now()+"-"+safeName;
      const {error:uploadError}=await db.storage.from("book-files").upload(filePath,file);
      if(uploadError)throw uploadError;
    }
    const payload={
      title_mr:document.getElementById("title_mr").value,
      title_hi:document.getElementById("title_hi").value,
      title_en:document.getElementById("title_en").value,
      description_mr:document.getElementById("description_mr").value,
      price:Number(document.getElementById("price").value||0),
      page_count:Number(document.getElementById("page_count").value||0),
      language:document.getElementById("language").value,
      is_free:document.getElementById("is_free").checked,
      is_published:document.getElementById("is_published").checked,
      currency:"INR",
      file_type:"pdf"
    };
    if(filePath)payload.file_url=filePath;
    let result;
    if(editingId){
      result=await db.from("books").update(payload).eq("id",editingId);
    }else{
      payload.author_id=currentUser.id;
      result=await db.from("books").insert(payload);
    }
    if(result.error)throw result.error;
    msg(editingId?"Book updated successfully.":"New book added successfully.");
    resetForm();
    await loadBooks();
  }catch(err){
    msg("Error: "+err.message,true);
  }finally{
    btn.disabled=false;
  }
});
db.auth.onAuthStateChange((event,session)=>{
  if(event==="SIGNED_OUT"){
    document.getElementById("adminArea").classList.add("hidden");
    document.getElementById("loginBox").classList.remove("hidden");
    document.getElementById("logoutBtn").classList.add("hidden");
  }
});
checkAdmin();
</script>
</body>
  </html>
